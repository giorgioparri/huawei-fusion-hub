name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Home Assistant 2026.3 and later require Python 3.14: on an older
          # interpreter pip silently falls back to the last release that still
          # supports it, and the tests run against the wrong Home Assistant
          python-version: "3.14"
      - name: Install dependencies
        # the floor matches hacs.json, so a fallback fails here instead
        run: pip install "homeassistant>=2026.8.0"
      - name: Show Home Assistant version
        run: python -c "import homeassistant.const as c; print(c.__version__)"
      - name: Run normalize tests
        run: python tests/test_normalize.py
      - name: Run rediscovery tests
        run: python tests/test_rediscovery.py
      - name: Run derived estimate tests
        run: python tests/test_derived.py
      - name: Run EMMA matching tests
        run: python tests/test_emma_matching.py
      - name: Run device info tests
        run: python tests/test_device_info.py
